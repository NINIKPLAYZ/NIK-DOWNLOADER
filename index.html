<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NIK DOWNLOADER</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f1f5f9;
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #cbd5e1;
      outline: none;
      border-radius: 12px;
      background: white;
      color: #111827;
      font-size: 16px;
      margin-bottom: 12px;
      text-align: center;
    }

    input::placeholder {
      text-align: center;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .download-main {
      background: #22c55e;
      color: white;
    }

    .download-main:hover {
      background: #16a34a;
    }

    .clear-btn {
      background: #ef4444;
      color: white;
    }

    .clear-btn:hover {
      background: #dc2626;
    }

    .option {
      background: #e2e8f0;
      color: #0f172a;
    }

    .quality {
      background: #2563eb;
      color: white;
    }

    .image-download {
      background: #f59e0b;
      color: white;
    }

    #options {
      display: none;
      margin-top: 20px;
    }

    #videoOptions {
      display: none;
    }

    #qualitySection {
      display: none;
    }

    #thumbnailSection {
      display: none;
      margin-top: 15px;
    }

    #thumbnailPreview {
      display: none;
      width: 100%;
      border-radius: 12px;
      margin-top: 15px;
      border: 1px solid #cbd5e1;
    }

    .section-title {
      margin-top: 18px;
      margin-bottom: 8px;
      font-size: 15px;
      color: #64748b;
      font-weight: bold;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      color: #64748b;
      font-size: 14px;
      min-height: 20px;
    }

    @media (prefers-color-scheme: dark) {

      body {
        background: #0f172a;
        color: #f8fafc;
      }

      .container {
        background: #1e293b;
        border-color: #334155;
        box-shadow: 0 10px 35px rgba(0,0,0,0.45);
      }

      .subtitle,
      .section-title,
      .message {
        color: #cbd5e1;
      }

      input {
        background: #f8fafc;
        color: #111827;
        border-color: #475569;
      }

      .option {
        background: #334155;
        color: white;
      }

      .option:hover {
        background: #475569;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>NIK DOWNLOADER</h1>

    <p class="subtitle">
      Download available media from supported sources
    </p>

    <!-- URL -->

    <input
      id="url"
      type="url"
      placeholder="PASTE URL HERE"
    >

    <!-- DOWNLOAD -->

    <button
      class="download-main"
      onclick="showOptions()"
    >
      DOWNLOAD
    </button>

    <!-- CLEAR -->

    <button
      id="clearBtn"
      class="clear-btn"
      onclick="clearAll()"
      style="display:none;"
    >
      CLEAR
    </button>


    <!-- OPTIONS -->

    <div id="options">

      <div class="section-title">
        SELECT DOWNLOAD TYPE
      </div>


      <!-- IMAGE DOWNLOAD -->

      <button
        class="option"
        onclick="selectImage()"
      >
        IMAGE DOWNLOAD
      </button>


      <!-- PROFILE DP -->

      <button
        class="option"
        onclick="selectProfileDP()"
      >
        PROFILE DP DOWNLOAD
      </button>


      <!-- VIDEO -->

      <button
        class="option"
        onclick="showVideoOptions()"
      >
        VIDEO DOWNLOAD
      </button>


      <!-- THUMBNAIL -->

      <div id="thumbnailSection">

        <div class="section-title">
          VIDEO THUMBNAIL
        </div>

        <canvas
          id="thumbnailCanvas"
          style="display:none;"
        ></canvas>

        <video
          id="videoPreview"
          style="display:none;"
          crossorigin="anonymous"
        ></video>

        <img
          id="thumbnailPreview"
          alt="Video Thumbnail"
        >

        <button
          class="image-download"
          onclick="downloadThumbnail()"
        >
          DOWNLOAD IMAGE
        </button>

      </div>


      <!-- VIDEO TYPES -->

      <div id="videoOptions">

        <div class="section-title">
          SELECT VIDEO TYPE
        </div>

        <button
          class="option"
          onclick="selectType('Audio Only')"
        >
          AUDIO ONLY
        </button>

        <button
          class="option"
          onclick="selectType('Video Only')"
        >
          VIDEO ONLY
        </button>

        <button
          class="option"
          onclick="selectType('Video + Audio')"
        >
          VIDEO + AUDIO
        </button>

      </div>


      <!-- QUALITY -->

      <div id="qualitySection">

        <div class="section-title">
          SELECT QUALITY
        </div>

        <button
          class="quality"
          onclick="downloadMedia('360p')"
        >
          360P
        </button>

        <button
          class="quality"
          onclick="downloadMedia('480p')"
        >
          480P
        </button>

        <button
          class="quality"
          onclick="downloadMedia('720p HD')"
        >
          720P HD
        </button>

        <button
          class="quality"
          onclick="downloadMedia('1080p Full HD')"
        >
          1080P FULL HD
        </button>

      </div>

    </div>


    <p
      id="message"
      class="message"
    ></p>

  </div>


  <script>

    let selectedType = "";
    let thumbnailData = "";


    /* SHOW OPTIONS */

    function showOptions() {

      const url =
        document.getElementById("url").value.trim();

      const message =
        document.getElementById("message");

      if (!url) {

        message.textContent =
          "PLEASE PASTE A URL FIRST.";

        return;
      }

      document.getElementById("options")
        .style.display = "block";

      document.getElementById("clearBtn")
        .style.display = "block";

      message.textContent =
        "SELECT WHAT YOU WANT TO DOWNLOAD.";
    }


    /* IMAGE DOWNLOAD */

    function selectImage() {

      selectedType = "IMAGE";

      document.getElementById("videoOptions")
        .style.display = "none";

      document.getElementById("qualitySection")
        .style.display = "none";

      generateThumbnail();

    }


    /* PROFILE DP */

    function selectProfileDP() {

      selectedType = "PROFILE DP";

      document.getElementById("videoOptions")
        .style.display = "none";

      document.getElementById("qualitySection")
        .style.display = "none";

      document.getElementById("thumbnailSection")
        .style.display = "none";

      document.getElementById("message")
        .textContent =
        "PROFILE DP DOWNLOAD SELECTED.";
    }


    /* VIDEO OPTIONS */

    function showVideoOptions() {

      document.getElementById("videoOptions")
        .style.display = "block";

      document.getElementById("qualitySection")
        .style.display = "none";

      document.getElementById("thumbnailSection")
        .style.display = "none";

      document.getElementById("message")
        .textContent =
        "SELECT VIDEO TYPE.";
    }


    /* VIDEO TYPE */

    function selectType(type) {

      selectedType = type;

      document.getElementById("qualitySection")
        .style.display = "block";

      document.getElementById("thumbnailSection")
        .style.display = "none";

      document.getElementById("message")
        .textContent =
        type.toUpperCase() +
        " SELECTED. SELECT QUALITY.";
    }


    /* GENERATE VIDEO THUMBNAIL */

    function generateThumbnail() {

      const url =
        document.getElementById("url").value.trim();

      const video =
        document.getElementById("videoPreview");

      const canvas =
        document.getElementById("thumbnailCanvas");

      const image =
        document.getElementById("thumbnailPreview");

      const message =
        document.getElementById("message");


      if (!url) {

        message.textContent =
          "PLEASE PASTE A VIDEO URL FIRST.";

        return;
      }


      document.getElementById("thumbnailSection")
        .style.display = "block";

      message.textContent =
        "CREATING VIDEO THUMBNAIL...";


      video.src = url;
      video.muted = true;
      video.currentTime = 1;


      video.onloadedmetadata = function() {

        if (video.duration < 1) {
          video.currentTime = 0;
        }

      };


      video.onseeked = function() {

        try {

          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;

          const ctx =
            canvas.getContext("2d");

          ctx.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
          );

          thumbnailData =
            canvas.toDataURL("image/jpeg", 0.9);

          image.src = thumbnailData;

          image.style.display = "block";

          message.textContent =
            "THUMBNAIL READY. CLICK DOWNLOAD IMAGE.";

        } catch (error) {

          message.textContent =
            "THUMBNAIL COULD NOT BE CREATED. THE VIDEO SERVER MAY BLOCK BROWSER ACCESS.";

        }

      };


      video.onerror = function() {

        message.textContent =
          "VIDEO URL COULD NOT BE LOADED.";
      };

    }


    /* DOWNLOAD THUMBNAIL */

    function downloadThumbnail() {

      if (!thumbnailData) {

        document.getElementById("message")
          .textContent =
          "THUMBNAIL IS NOT READY.";

        return;
      }


      const link =
        document.createElement("a");

      link.href = thumbnailData;

      link.download =
        "NIK-Downloader-Thumbnail.jpg";

      document.body.appendChild(link);

      link.click();

      document.body.removeChild(link);


      document.getElementById("message")
        .textContent =
        "THUMBNAIL DOWNLOAD STARTED.";
    }


    /* VIDEO DOWNLOAD */

    function downloadMedia(quality) {

      const url =
        document.getElementById("url").value.trim();

      if (!url) {

        document.getElementById("message")
          .textContent =
          "PLEASE PASTE A URL FIRST.";

        return;
      }

      if (!selectedType) {
        return;
      }


      document.getElementById("message")
        .textContent =
        "PREPARING " +
        selectedType +
        " - " +
        quality +
        "...";


      /*
        ACTUAL VIDEO DOWNLOAD BACKEND
        NEEDS TO BE CONNECTED HERE.

        Only content that the user is
        authorized/permitted to download
        should be processed.
      */


      alert(
        "DOWNLOAD SELECTED\n\n" +
        "TYPE: " + selectedType +
        "\nQUALITY: " + quality +
        "\n\nBACKEND DOWNLOAD SYSTEM NEEDS TO BE CONNECTED."
      );

    }


    /* CLEAR EVERYTHING */

    function clearAll() {

      document.getElementById("url")
        .value = "";

      document.getElementById("options")
        .style.display = "none";

      document.getElementById("videoOptions")
        .style.display = "none";

      document.getElementById("qualitySection")
        .style.display = "none";

      document.getElementById("thumbnailSection")
        .style.display = "none";

      document.getElementById("clearBtn")
        .style.display = "none";

      document.getElementById("thumbnailPreview")
        .style.display = "none";

      document.getElementById("thumbnailPreview")
        .src = "";

      document.getElementById("videoPreview")
        .src = "";

      document.getElementById("message")
        .textContent = "";

      selectedType = "";
      thumbnailData = "";
    }

  </script>

</body>
</html>
