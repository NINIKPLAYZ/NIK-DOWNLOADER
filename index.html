<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NIK DOWNLOADER</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  background: #f1f5f9;
  color: #0f172a;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 20px;
}

.container {
  width: 100%;
  max-width: 520px;

  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 22px;
  padding: 25px;

  box-shadow: 0 10px 35px rgba(0,0,0,.12);
}

h1 {
  text-align: center;
  font-size: 30px;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #64748b;
  margin-bottom: 25px;
  font-size: 16px;
}

input {
  width: 100%;
  padding: 15px;

  border: 1px solid #cbd5e1;
  outline: none;
  border-radius: 12px;

  background: white;
  color: #111827;

  font-size: 16px;
  text-align: center;
}

input:focus {
  border-color: #2563eb;
}

input::placeholder {
  text-align: center;
}

button {
  width: 100%;
  border: none;
  border-radius: 12px;

  padding: 14px;
  margin-top: 10px;

  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.clear-btn {
  background: #ef4444;
  color: white;
}

.option {
  background: #e2e8f0;
  color: #0f172a;
}

.quality {
  background: #2563eb;
  color: white;
}

.find-btn {
  background: #2563eb;
  color: white;
}

.download-btn {
  background: #16a34a;
  color: white;
}

#clearButton {
  display: none;
}

#options {
  min-height: 430px;
  padding-top: 10px;
}

#downloadButtons {
  display: none;
}

#videoOptions {
  display: none;
}

#qualitySection {
  display: none;
}

#videoResult {
  display: none;
  margin-top: 18px;
}

.preview {
  width: 100%;
  border-radius: 12px;
  background: #000;
  margin-top: 10px;
}

.section-title {
  margin-top: 18px;
  margin-bottom: 8px;

  font-size: 15px;
  color: #64748b;

  font-weight: bold;
  text-align: center;
}

.message {
  text-align: center;
  margin-top: 15px;

  color: #64748b;
  font-size: 14px;

  min-height: 20px;
  font-weight: bold;
}

.format-item {
  margin-top: 10px;
}

@media (prefers-color-scheme: dark) {

  body {
    background: #0f172a;
    color: #f8fafc;
  }

  .container {
    background: #1e293b;
    border-color: #334155;
  }

  .subtitle,
  .section-title {
    color: #cbd5e1;
  }

  .message {
    color: #cbd5e1;
  }

  input {
    background: #0f172a;
    color: white;
    border-color: #475569;
  }

  input::placeholder {
    color: #94a3b8;
  }

  .option {
    background: #334155;
    color: white;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>NIK DOWNLOADER</h1>

  <p class="subtitle">
    Download available media from supported sources
  </p>

  <input
    id="url"
    type="text"
    placeholder="PASTE URL HERE"
    autocomplete="off"
    spellcheck="false"
  >

  <button
    id="clearButton"
    class="clear-btn"
    onclick="clearAll()"
  >
    CLEAR
  </button>

  <div id="options">

    <div id="downloadButtons">

      <div class="section-title">
        SELECT DOWNLOAD TYPE
      </div>

      <button
        class="option"
        onclick="selectImage()"
      >
        IMAGE DOWNLOAD
      </button>

      <button
        class="option"
        onclick="selectProfileDP()"
      >
        PROFILE DP DOWNLOAD
      </button>

      <button
        class="option"
        onclick="showVideoOptions()"
      >
        VIDEO DOWNLOAD
      </button>

    </div>

    <div id="videoOptions">

      <div class="section-title">
        SELECT VIDEO TYPE
      </div>

      <button
        class="option"
        onclick="selectType('Audio Only')"
      >
        AUDIO ONLY
      </button>

      <button
        class="option"
        onclick="selectType('Video Only')"
      >
        VIDEO ONLY
      </button>

      <button
        class="option"
        onclick="selectType('Video + Audio')"
      >
        VIDEO + AUDIO
      </button>

    </div>

    <div id="qualitySection">

      <div class="section-title">
        FIND VIDEO
      </div>

      <button
        class="find-btn"
        onclick="findVideo()"
      >
        FIND VIDEO
      </button>

    </div>

    <div id="videoResult">

      <div class="section-title">
        VIDEO PREVIEW
      </div>

      <video
        id="videoPreview"
        class="preview"
        controls
        playsinline
      ></video>

      <div class="section-title">
        AVAILABLE FORMATS
      </div>

      <div id="formatList"></div>

    </div>

  </div>

  <p id="message" class="message"></p>

</div>

<script>

const BACKEND_URL =
  "https://nik-downloader-backend.onrender.com";

const urlInput =
  document.getElementById("url");

const clearButton =
  document.getElementById("clearButton");

const downloadButtons =
  document.getElementById("downloadButtons");

const videoOptions =
  document.getElementById("videoOptions");

const qualitySection =
  document.getElementById("qualitySection");

const videoResult =
  document.getElementById("videoResult");

const videoPreview =
  document.getElementById("videoPreview");

const formatList =
  document.getElementById("formatList");

const message =
  document.getElementById("message");

let selectedType = "";
let foundVideos = [];


/* URL INPUT */

urlInput.addEventListener("input", function () {

  const url =
    this.value.trim();

  if (url) {

    clearButton.style.display =
      "block";

    downloadButtons.style.display =
      "block";

  } else {

    resetPage();

  }

});


/* URL CHECK */

function isValidUrl(url) {

  try {

    const parsed =
      new URL(url);

    return (
      parsed.protocol === "http:" ||
      parsed.protocol === "https:"
    );

  } catch {

    return false;

  }

}


function checkUrl() {

  const url =
    urlInput.value.trim();

  if (!url || !isValidUrl(url)) {

    message.textContent =
      "✕ INVALID URL";

    return false;
  }

  message.textContent = "";

  return true;
}


/* IMAGE */

function selectImage() {

  if (!checkUrl()) return;

  selectedType = "IMAGE";

  videoOptions.style.display =
    "none";

  qualitySection.style.display =
    "none";

  videoResult.style.display =
    "none";

  message.textContent =
    "IMAGE DOWNLOAD SELECTED.";
}


/* PROFILE */

function selectProfileDP() {

  if (!checkUrl()) return;

  selectedType =
    "PROFILE DP";

  videoOptions.style.display =
    "none";

  qualitySection.style.display =
    "none";

  videoResult.style.display =
    "none";

  message.textContent =
    "PROFILE DP DOWNLOAD SELECTED.";
}


/* VIDEO */

function showVideoOptions() {

  if (!checkUrl()) return;

  selectedType = "";

  videoOptions.style.display =
    "block";

  qualitySection.style.display =
    "none";

  videoResult.style.display =
    "none";

  message.textContent =
    "SELECT VIDEO TYPE.";
}


/* VIDEO TYPE */

function selectType(type) {

  if (!checkUrl()) return;

  selectedType = type;

  qualitySection.style.display =
    "block";

  videoResult.style.display =
    "none";

  message.textContent =
    type.toUpperCase() +
    " SELECTED. TAP FIND VIDEO.";
}


/* FIND VIDEO */

async function findVideo() {

  if (!checkUrl()) return;

  if (
    selectedType !== "Audio Only" &&
    selectedType !== "Video Only" &&
    selectedType !== "Video + Audio"
  ) {

    message.textContent =
      "PLEASE SELECT VIDEO TYPE.";

    return;
  }

  const url =
    urlInput.value.trim();

  message.textContent =
    "FINDING VIDEO...";

  videoResult.style.display =
    "none";

  formatList.innerHTML =
    "";

  foundVideos = [];

  try {

    const response =
      await fetch(
        BACKEND_URL +
        "/find-video?url=" +
        encodeURIComponent(url)
      );

    const result =
      await response.json();

    if (
      !response.ok ||
      !result.success
    ) {

      message.textContent =
        result.message ||
        "VIDEO NOT FOUND.";

      return;
    }

    if (
      !result.videos ||
      result.videos.length === 0
    ) {

      message.textContent =
        "NO PUBLIC VIDEO FOUND.";

      return;
    }

    foundVideos =
      result.videos;

    /*
      Preview first available source
    */
    videoPreview.src =
      foundVideos[0].url ||
      foundVideos[0];

    videoPreview.load();

    videoResult.style.display =
      "block";

    /*
      Show every source returned
      by the backend.
    */
    foundVideos.forEach(
      (video, index) => {

        const videoUrl =
          video.url || video;

        const type =
          video.type ||
          "VIDEO";

        const label =
          video.label ||
          type.toUpperCase();

        const item =
          document.createElement("div");

        item.className =
          "format-item";

        const button =
          document.createElement("button");

        button.className =
          "download-btn";

        button.textContent =
          label;

        button.onclick =
          function () {

            downloadVideo(
              videoUrl
            );

          };

        item.appendChild(button);

        formatList.appendChild(item);

      }
    );

    message.textContent =
      "VIDEO FOUND. SELECT FORMAT.";

  } catch (error) {

    console.error(error);

    message.textContent =
      "VIDEO COULD NOT BE FOUND.";
  }
}


/* DOWNLOAD */

function downloadVideo(videoUrl) {

  if (!videoUrl) {

    message.textContent =
      "VIDEO URL NOT AVAILABLE.";

    return;
  }

  message.textContent =
    "DOWNLOAD STARTING...";

  const downloadUrl =
    BACKEND_URL +
    "/download?url=" +
    encodeURIComponent(videoUrl);

  window.location.href =
    downloadUrl;
}


/* CLEAR */

function clearAll() {

  resetPage();

}


function resetPage() {

  urlInput.value = "";

  clearButton.style.display =
    "none";

  downloadButtons.style.display =
    "none";

  videoOptions.style.display =
    "none";

  qualitySection.style.display =
    "none";

  videoResult.style.display =
    "none";

  videoPreview.pause();

  videoPreview.removeAttribute("src");

  videoPreview.load();

  formatList.innerHTML =
    "";

  message.textContent =
    "";

  selectedType = "";

  foundVideos = [];
}

</script>

</body>
  </html>
