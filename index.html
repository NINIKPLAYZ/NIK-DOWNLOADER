<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NIK DOWNLOADER</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  background: #f1f5f9;
  color: #0f172a;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 20px;
}

.container {
  width: 100%;
  max-width: 520px;

  background: white;

  border: 1px solid #e2e8f0;
  border-radius: 22px;

  padding: 25px;

  box-shadow: 0 10px 35px rgba(0,0,0,.12);
}

h1 {
  text-align: center;
  font-size: 30px;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #64748b;
  margin-bottom: 25px;
  font-size: 16px;
}

input {
  width: 100%;
  padding: 15px;

  border: 1px solid #cbd5e1;
  outline: none;

  border-radius: 12px;

  background: white;
  color: #111827;

  font-size: 16px;
  text-align: center;
}

input:focus {
  border-color: #2563eb;
}

input::placeholder {
  text-align: center;
}

button {
  width: 100%;

  border: none;
  border-radius: 12px;

  padding: 14px;
  margin-top: 10px;

  font-size: 16px;
  font-weight: bold;

  cursor: pointer;
}

.clear-btn {
  background: #ef4444;
  color: white;
}

.option {
  background: #e2e8f0;
  color: #0f172a;
}

.quality {
  background: #2563eb;
  color: white;
}

#clearButton {
  display: none;
}

#options {
  min-height: 430px;
  padding-top: 10px;
}

#downloadButtons {
  display: none;
}

#videoOptions {
  display: none;
}

#qualitySection {
  display: none;
}

.section-title {
  margin-top: 18px;
  margin-bottom: 8px;

  font-size: 15px;
  color: #64748b;

  font-weight: bold;
  text-align: center;
}

.message {
  text-align: center;

  margin-top: 15px;

  color: #64748b;

  font-size: 14px;

  min-height: 20px;

  font-weight: bold;
}

.hidden {
  display: none !important;
}

@media (prefers-color-scheme: dark) {

  body {
    background: #0f172a;
    color: #f8fafc;
  }

  .container {
    background: #1e293b;
    border-color: #334155;
  }

  .subtitle,
  .section-title {
    color: #cbd5e1;
  }

  .message {
    color: #cbd5e1;
  }

  input {
    background: #0f172a;
    color: white;
    border-color: #475569;
  }

  input::placeholder {
    color: #94a3b8;
  }

  .option {
    background: #334155;
    color: white;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>NIK DOWNLOADER</h1>

  <p class="subtitle">
    Download available media from supported sources
  </p>

  <!-- URL -->
  <input
    id="url"
    type="text"
    placeholder="PASTE URL HERE"
    autocomplete="off"
    spellcheck="false"
  >

  <!-- CLEAR -->
  <button
    id="clearButton"
    class="clear-btn"
    onclick="clearAll()"
  >
    CLEAR
  </button>

  <!-- OPTIONS -->
  <div id="options">

    <!-- DOWNLOAD BUTTONS -->
    <div id="downloadButtons">

      <div class="section-title">
        SELECT DOWNLOAD TYPE
      </div>

      <button
        class="option"
        onclick="selectImage()"
      >
        IMAGE DOWNLOAD
      </button>

      <button
        class="option"
        onclick="selectProfileDP()"
      >
        PROFILE DP DOWNLOAD
      </button>

      <button
        class="option"
        onclick="showVideoOptions()"
      >
        VIDEO DOWNLOAD
      </button>

    </div>

    <!-- VIDEO OPTIONS -->
    <div id="videoOptions">

      <div class="section-title">
        SELECT VIDEO TYPE
      </div>

      <button
        class="option"
        onclick="selectType('Audio Only')"
      >
        AUDIO ONLY
      </button>

      <button
        class="option"
        onclick="selectType('Video Only')"
      >
        VIDEO ONLY
      </button>

      <button
        class="option"
        onclick="selectType('Video + Audio')"
      >
        VIDEO + AUDIO
      </button>

    </div>

    <!-- QUALITY -->
    <div id="qualitySection">

      <div class="section-title">
        SELECT QUALITY
      </div>

      <button
        class="quality"
        onclick="downloadMedia('360p')"
      >
        360P
      </button>

      <button
        class="quality"
        onclick="downloadMedia('480p')"
      >
        480P
      </button>

      <button
        class="quality"
        onclick="downloadMedia('720p HD')"
      >
        720P HD
      </button>

      <button
        class="quality"
        onclick="downloadMedia('1080p Full HD')"
      >
        1080P FULL HD
      </button>

    </div>

  </div>

  <!-- MESSAGE -->
  <p id="message" class="message"></p>

</div>

<script>

/* BACKEND */
const BACKEND_URL =
  "https://nik-downloader-backend.onrender.com";


/* ELEMENTS */
const urlInput =
  document.getElementById("url");

const clearButton =
  document.getElementById("clearButton");

const downloadButtons =
  document.getElementById("downloadButtons");

const videoOptions =
  document.getElementById("videoOptions");

const qualitySection =
  document.getElementById("qualitySection");

const message =
  document.getElementById("message");


/* SELECTED TYPE */
let selectedType = "";


/* URL INPUT */
urlInput.addEventListener("input", function () {

  const url =
    this.value.trim();

  if (url) {

    clearButton.style.display =
      "block";

    downloadButtons.style.display =
      "block";

  } else {

    clearButton.style.display =
      "none";

    downloadButtons.style.display =
      "none";

    videoOptions.style.display =
      "none";

    qualitySection.style.display =
      "none";

    message.textContent = "";

    selectedType = "";
  }

});


/* CHECK URL */
function isValidUrl(url) {

  try {

    const parsed =
      new URL(url);

    return (
      parsed.protocol === "http:" ||
      parsed.protocol === "https:"
    );

  } catch {

    return false;

  }

}


/* URL CHECK */
function checkUrl() {

  const url =
    urlInput.value.trim();

  if (!url || !isValidUrl(url)) {

    message.textContent =
      "✕ INVALID URL";

    return false;
  }

  message.textContent = "";

  return true;
}


/* IMAGE */
function selectImage() {

  if (!checkUrl()) {
    return;
  }

  selectedType = "IMAGE";

  videoOptions.style.display =
    "none";

  qualitySection.style.display =
    "none";

  message.textContent =
    "IMAGE DOWNLOAD SELECTED.";
}


/* PROFILE DP */
function selectProfileDP() {

  if (!checkUrl()) {
    return;
  }

  selectedType =
    "PROFILE DP";

  videoOptions.style.display =
    "none";

  qualitySection.style.display =
    "none";

  message.textContent =
    "PROFILE DP DOWNLOAD SELECTED.";
}


/* VIDEO */
function showVideoOptions() {

  if (!checkUrl()) {
    return;
  }

  selectedType = "";

  videoOptions.style.display =
    "block";

  qualitySection.style.display =
    "none";

  message.textContent =
    "SELECT VIDEO TYPE.";
}


/* VIDEO TYPE */
function selectType(type) {

  if (!checkUrl()) {
    return;
  }

  selectedType = type;

  qualitySection.style.display =
    "block";

  message.textContent =
    type.toUpperCase() +
    " SELECTED. SELECT QUALITY.";
}


/* DOWNLOAD */
async function downloadMedia(quality) {

  if (!checkUrl()) {
    return;
  }

  /*
    Only video types can use
    the quality/download system.
  */
  if (
    selectedType !== "Audio Only" &&
    selectedType !== "Video Only" &&
    selectedType !== "Video + Audio"
  ) {

    message.textContent =
      "PLEASE SELECT VIDEO TYPE.";

    return;
  }

  const url =
    urlInput.value.trim();

  message.textContent =
    "VIDEO SOURCE FINDING...";

  try {

    /*
      First check whether the URL itself
      is already a direct media URL.
    */
    const lowerUrl =
      url.toLowerCase();

    const isDirectVideo =
      lowerUrl.includes(".mp4") ||
      lowerUrl.includes(".webm") ||
      lowerUrl.includes(".mov") ||
      lowerUrl.includes(".m4v") ||
      lowerUrl.includes(".ogv");

    if (isDirectVideo) {

      message.textContent =
        "VIDEO FOUND. DOWNLOAD STARTING...";

      const directDownloadUrl =
        BACKEND_URL +
        "/download?url=" +
        encodeURIComponent(url);

      window.location.href =
        directDownloadUrl;

      return;
    }


    /*
      If it is an HTML page,
      ask backend to find an openly
      embedded video source.
    */
    const findUrl =
      BACKEND_URL +
      "/find-video?url=" +
      encodeURIComponent(url);

    const findResponse =
      await fetch(findUrl);

    const result =
      await findResponse.json();

    if (!findResponse.ok ||
        !result.success) {

      message.textContent =
        result.message ||
        "VIDEO SOURCE NOT FOUND.";

      return;
    }

    if (
      !result.videos ||
      result.videos.length === 0
    ) {

      message.textContent =
        "NO PUBLIC VIDEO FOUND.";

      return;
    }


    /*
      Use first public video source.
    */
    const videoUrl =
      result.videos[0];

    message.textContent =
      "VIDEO FOUND. DOWNLOAD STARTING...";


    /*
      Send direct video URL
      to backend downloader.
    */
    const downloadUrl =
      BACKEND_URL +
      "/download?url=" +
      encodeURIComponent(videoUrl);

    window.location.href =
      downloadUrl;

  } catch (error) {

    console.error(
      "Download error:",
      error
    );

    message.textContent =
      "VIDEO COULD NOT BE FOUND.";
  }

}


/* CLEAR */
function clearAll() {

  urlInput.value = "";

  clearButton.style.display =
    "none";

  downloadButtons.style.display =
    "none";

  videoOptions.style.display =
    "none";

  qualitySection.style.display =
    "none";

  message.textContent =
    "";

  selectedType = "";

}

</script>

</body>
</html>
