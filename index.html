<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NIK Downloader</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  color: white;
}

.container {
  width: 100%;
  max-width: 520px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(15px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 22px;
  padding: 25px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.35);
}

h1 {
  text-align: center;
  font-size: 30px;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #cbd5e1;
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 15px;
  border: none;
  outline: none;
  border-radius: 12px;
  background: #f8fafc;
  color: #111827;
  font-size: 16px;
  margin-bottom: 12px;
}

button {
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 14px;
  margin-top: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.download-main {
  background: #22c55e;
  color: white;
}

.download-main:hover {
  background: #16a34a;
}

#options {
  display: none;
  margin-top: 20px;
}

.section-title {
  margin-top: 18px;
  margin-bottom: 8px;
  font-size: 15px;
  color: #cbd5e1;
}

.option {
  background: #334155;
  color: white;
}

.option:hover {
  background: #475569;
}

.quality {
  background: #2563eb;
  color: white;
}

#qualitySection {
  display: none;
}

.message {
  text-align: center;
  margin-top: 15px;
  color: #cbd5e1;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

  <h1>NIK Downloader</h1>

  <p class="subtitle">
    Download available media from supported sources
  </p>

  <input
    id="url"
    type="url"
    placeholder="Paste video URL here..."
  >

  <!-- ALWAYS VISIBLE -->
  <button
    class="download-main"
    onclick="showOptions()"
  >
    DOWNLOAD
  </button>

  <div id="options">

    <div class="section-title">
      Select Download Type
    </div>

    <button class="option" onclick="selectType('Audio Only')">
      Audio Only
    </button>

    <button class="option" onclick="selectType('Video Only')">
      Video Only
    </button>

    <button class="option" onclick="selectType('Video + Audio')">
      Video + Audio
    </button>

    <div id="qualitySection">

      <div class="section-title">
        Select Quality
      </div>

      <button class="quality" onclick="downloadMedia('360p')">
        360p
      </button>

      <button class="quality" onclick="downloadMedia('480p')">
        480p
      </button>

      <button class="quality" onclick="downloadMedia('720p HD')">
        720p HD
      </button>

      <button class="quality" onclick="downloadMedia('1080p Full HD')">
        1080p Full HD
      </button>

    </div>

  </div>

  <p id="message" class="message"></p>

</div>

<script>

let selectedType = "";

function showOptions() {

  const url = document.getElementById("url").value.trim();

  if (!url) {
    document.getElementById("message").textContent =
      "Please paste a URL first.";
    return;
  }

  document.getElementById("options").style.display = "block";

  document.getElementById("message").textContent =
    "Select download type.";
}

function selectType(type) {

  selectedType = type;

  document.getElementById("qualitySection").style.display = "block";

  document.getElementById("message").textContent =
    type + " selected. Now select quality.";
}

function downloadMedia(quality) {

  const url = document.getElementById("url").value.trim();

  if (!url) {
    return;
  }

  if (!selectedType) {
    return;
  }

  document.getElementById("message").textContent =
    "Preparing " + selectedType + " - " + quality + "...";

  /*
    ACTUAL BACKEND DOWNLOAD API WILL BE CONNECTED HERE.

    The backend should process only media that the user
    is authorized/permitted to download.
  */

  alert(
    "Download selected\n\n" +
    "Type: " + selectedType + "\n" +
    "Quality: " + quality
  );
}

</script>

</body>
</html>
