<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NIK DOWNLOADER</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}


/* PAGE BACKGROUND */

body {
  min-height: 100vh;

  background: #f1f5f9;
  color: #0f172a;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 20px;
}


/* WHITE CARD */

.container {
  width: 100%;
  max-width: 520px;

  background: white;

  border: 1px solid #e2e8f0;
  border-radius: 22px;

  padding: 25px;

  box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
}


/* URL BOX */

input {
  width: 100%;

  padding: 15px;

  border: 1px solid #cbd5e1;
  outline: none;

  border-radius: 12px;

  background: white;
  color: #111827;

  font-size: 16px;

  text-align: center;
}

input:focus {
  border-color: #2563eb;
}

input::placeholder {
  text-align: center;
  color: #64748b;
}


/* DOWNLOAD BUTTON */

.download-btn {
  width: 100%;

  padding: 14px;

  margin-top: 10px;

  background: #22c55e;
  color: white;

  border: none;
  outline: none;

  border-radius: 12px;

  font-size: 17px;
  font-weight: bold;

  cursor: pointer;
}

.download-btn:hover {
  background: #16a34a;
}


/* CLEAR BUTTON */

.clear-btn {
  width: 100%;

  padding: 14px;

  margin-top: 10px;

  background: #ef4444;
  color: white;

  border: none;
  outline: none;

  border-radius: 12px;

  font-size: 17px;
  font-weight: bold;

  cursor: pointer;
}


/* OPTIONS */

.option,
.quality {
  width: 100%;

  display: block;

  margin: 10px auto;

  padding: 15px;

  background: #e2e8f0;
  color: #0f172a;

  border: none;
  outline: none;

  border-radius: 12px;

  font-size: 16px;
  font-weight: bold;

  cursor: pointer;
}

.option:hover,
.quality:hover {
  background: #cbd5e1;
}


/* HIDDEN */

#clearButton {
  display: none;
}

#downloadButton {
  display: none;
}

#downloadButtons {
  display: none;
}

#videoOptions {
  display: none;
}

#qualitySection {
  display: none;
}


/* OPTIONS */

#options {
  padding-top: 10px;
}


/* SECTION TITLE */

.section-title {
  margin-top: 18px;
  margin-bottom: 8px;

  font-size: 15px;

  color: #64748b;

  font-weight: bold;
}


/* MESSAGE */

.message {
  text-align: center;

  margin-top: 15px;

  color: #64748b;

  font-size: 14px;

  min-height: 20px;

  font-weight: bold;
}


/* DARK MODE */

@media (prefers-color-scheme: dark) {

  body {
    background: #0f172a;
    color: #f8fafc;
  }

  .container {
    background: #1e293b;
    border-color: #334155;

    box-shadow:
      0 10px 35px rgba(0, 0, 0, 0.35);
  }

  input {
    background: #0f172a;
    color: white;
    border-color: #475569;
  }

  input::placeholder {
    color: #94a3b8;
  }

  .option,
  .quality {
    background: #334155;
    color: white;
  }

  .option:hover,
  .quality:hover {
    background: #475569;
  }

  .section-title,
  .message {
    color: #cbd5e1;
  }

}

</style>

</head>


<body>

<div class="container">


  <!-- URL -->

  <input
    id="url"
    type="text"
    placeholder="PASTE URL HERE"
    autocomplete="off"
    spellcheck="false"
  >


  <!-- DOWNLOAD -->

  <button
    id="downloadButton"
    class="download-btn"
    onclick="startDownload()"
  >
    DOWNLOAD
  </button>


  <!-- CLEAR -->

  <button
    id="clearButton"
    class="clear-btn"
    onclick="clearAll()"
  >
    CLEAR
  </button>


  <!-- OPTIONS -->

  <div id="options">


    <!-- DOWNLOAD TYPES -->

    <div id="downloadButtons">

      <div class="section-title">
        SELECT DOWNLOAD TYPE
      </div>


      <button
        class="option"
        onclick="selectImage()"
      >
        IMAGE DOWNLOAD
      </button>


      <button
        class="option"
        onclick="selectProfileDP()"
      >
        PROFILE DP DOWNLOAD
      </button>


      <button
        class="option"
        onclick="showVideoOptions()"
      >
        VIDEO DOWNLOAD
      </button>

    </div>


    <!-- VIDEO TYPES -->

    <div id="videoOptions">

      <div class="section-title">
        SELECT VIDEO TYPE
      </div>


      <button
        class="option"
        onclick="selectType('Audio Only')"
      >
        AUDIO ONLY
      </button>


      <button
        class="option"
        onclick="selectType('Video Only')"
      >
        VIDEO ONLY
      </button>


      <button
        class="option"
        onclick="selectType('Video + Audio')"
      >
        VIDEO + AUDIO
      </button>

    </div>


    <!-- QUALITY -->

    <div id="qualitySection">

      <div class="section-title">
        SELECT QUALITY
      </div>


      <button
        class="quality"
        onclick="downloadMedia('360p')"
      >
        360P
      </button>


      <button
        class="quality"
        onclick="downloadMedia('480p')"
      >
        480P
      </button>


      <button
        class="quality"
        onclick="downloadMedia('720p HD')"
      >
        720P HD
      </button>


      <button
        class="quality"
        onclick="downloadMedia('1080p Full HD')"
      >
        1080P FULL HD
      </button>

    </div>

  </div>


  <!-- MESSAGE -->

  <p
    id="message"
    class="message"
  ></p>

</div>


<script>


/* BACKEND */

const BACKEND_URL =
  "https://nik-downloader-backend.onrender.com";


/* ELEMENTS */

const urlInput =
  document.getElementById("url");

const downloadButton =
  document.getElementById("downloadButton");

const clearButton =
  document.getElementById("clearButton");

const downloadButtons =
  document.getElementById("downloadButtons");

const videoOptions =
  document.getElementById("videoOptions");

const qualitySection =
  document.getElementById("qualitySection");

const message =
  document.getElementById("message");


let selectedType = "";


/* URL INPUT */

urlInput.addEventListener("input", function() {

  const url =
    this.value.trim();


  if (url) {

    downloadButton.style.display =
      "block";

    clearButton.style.display =
      "block";

    downloadButtons.style.display =
      "block";

  } else {

    downloadButton.style.display =
      "none";

    clearButton.style.display =
      "none";

    downloadButtons.style.display =
      "none";

    videoOptions.style.display =
      "none";

    qualitySection.style.display =
      "none";

    message.textContent =
      "";

    selectedType =
      "";
  }

});


/* URL CHECK */

function isValidUrl(url) {

  try {

    const parsed =
      new URL(url);

    return (
      parsed.protocol === "http:" ||
      parsed.protocol === "https:"
    );

  } catch {

    return false;
  }

}


/* CHECK */

function checkUrl() {

  const url =
    urlInput.value.trim();


  if (!url || !isValidUrl(url)) {

    message.textContent =
      "✕ INVALID URL";

    return false;
  }


  message.textContent =
    "";

  return true;
}


/* DOWNLOAD BUTTON */

function startDownload() {

  if (!checkUrl()) {
    return;
  }

  message.textContent =
    "SELECT DOWNLOAD TYPE.";
}


/* IMAGE */

function selectImage() {

  if (!checkUrl()) return;

  selectedType =
    "IMAGE";

  videoOptions.style.display =
    "none";

  qualitySection.style.display =
    "none";

  message.textContent =
    "IMAGE DOWNLOAD SELECTED.";
}


/* PROFILE DP */

function selectProfileDP() {

  if (!checkUrl()) return;

  selectedType =
    "PROFILE DP";

  videoOptions.style.display =
    "none";

  qualitySection.style.display =
    "none";

  message.textContent =
    "PROFILE DP DOWNLOAD SELECTED.";
}


/* VIDEO */

function showVideoOptions() {

  if (!checkUrl()) return;

  selectedType =
    "";

  videoOptions.style.display =
    "block";

  qualitySection.style.display =
    "none";

  message.textContent =
    "SELECT VIDEO TYPE.";
}


/* VIDEO TYPE */

function selectType(type) {

  if (!checkUrl()) return;

  selectedType =
    type;

  qualitySection.style.display =
    "block";

  message.textContent =
    type.toUpperCase() +
    " SELECTED. SELECT QUALITY.";
}


/* DOWNLOAD */

async function downloadMedia(quality) {

  if (!checkUrl()) return;


  if (!selectedType) {

    message.textContent =
      "PLEASE SELECT DOWNLOAD TYPE.";

    return;
  }


  const url =
    urlInput.value.trim();


  message.textContent =
    "DOWNLOAD STARTING...";


  const downloadUrl =
    BACKEND_URL +
    "/download?url=" +
    encodeURIComponent(url);


  try {

    const response =
      await fetch(downloadUrl);


    if (!response.ok) {

      let errorMessage =
        "VIDEO DOWNLOAD FAILED.";


      try {

        const data =
          await response.json();


        if (data.message) {
          errorMessage =
            data.message;
        }

      } catch {}


      message.textContent =
        "✕ " + errorMessage;

      return;
    }


    const blob =
      await response.blob();


    const blobUrl =
      URL.createObjectURL(blob);


    const link =
      document.createElement("a");


    link.href =
      blobUrl;


    link.download =
      "NIK DOWNLOADER";


    document.body.appendChild(link);

    link.click();

    link.remove();


    setTimeout(() => {
      URL.revokeObjectURL(blobUrl);
    }, 1000);


    message.textContent =
      "DOWNLOAD COMPLETE.";

  } catch (error) {

    console.error(error);

    message.textContent =
      "✕ VIDEO DOWNLOAD FAILED.";
  }

}


/* CLEAR */

function clearAll() {

  urlInput.value =
    "";

  downloadButton.style.display =
    "none";

  clearButton.style.display =
    "none";

  downloadButtons.style.display =
    "none";

  videoOptions.style.display =
    "none";

  qualitySection.style.display =
    "none";

  message.textContent =
    "";

  selectedType =
    "";
}

</script>

</body>
</html>
