<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NIK DOWNLOADER</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f1f5f9;
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 25px;
      font-size: 16px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #cbd5e1;
      outline: none;
      border-radius: 12px;
      background: white;
      color: #111827;
      font-size: 16px;
      margin-bottom: 12px;
      text-align: center;
    }

    input:focus {
      border-color: #2563eb;
    }

    input::placeholder {
      text-align: center;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .clear-btn {
      background: #ef4444;
      color: white;
    }

    .option {
      background: #e2e8f0;
      color: #0f172a;
    }

    .quality {
      background: #2563eb;
      color: white;
    }

    /* Main options always visible */
    #options {
      display: block;
    }

    /* CLEAR hidden until URL is entered */
    #clearButton {
      display: none;
    }

    /* Video options hidden initially */
    #videoOptions,
    #qualitySection {
      display: none;
    }

    .section-title {
      margin-top: 18px;
      margin-bottom: 8px;
      font-size: 15px;
      color: #64748b;
      font-weight: bold;
      text-align: center;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      color: #64748b;
      font-size: 14px;
      min-height: 20px;
      font-weight: bold;
    }

    @media (prefers-color-scheme: dark) {

      body {
        background: #0f172a;
        color: #f8fafc;
      }

      .container {
        background: #1e293b;
        border-color: #334155;
      }

      .subtitle,
      .section-title {
        color: #cbd5e1;
      }

      .message {
        color: #cbd5e1;
      }

      input {
        background: #0f172a;
        color: white;
        border-color: #475569;
      }

      input::placeholder {
        color: #94a3b8;
      }

      .option {
        background: #334155;
        color: white;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>NIK DOWNLOADER</h1>

    <p class="subtitle">
      Download available media from supported sources
    </p>

    <!-- URL INPUT -->
    <input
      id="url"
      type="text"
      placeholder="PASTE URL HERE"
      autocomplete="off"
    >

    <!-- CLEAR BUTTON -->
    <button
      id="clearButton"
      class="clear-btn"
      onclick="clearAll()"
    >
      CLEAR
    </button>


    <!-- MAIN OPTIONS -->
    <div id="options">

      <div class="section-title">
        SELECT DOWNLOAD TYPE
      </div>


      <!-- IMAGE DOWNLOAD -->
      <button
        class="option"
        onclick="selectImage()"
      >
        IMAGE DOWNLOAD
      </button>


      <!-- PROFILE DP DOWNLOAD -->
      <button
        class="option"
        onclick="selectProfileDP()"
      >
        PROFILE DP DOWNLOAD
      </button>


      <!-- VIDEO DOWNLOAD -->
      <button
        class="option"
        onclick="showVideoOptions()"
      >
        VIDEO DOWNLOAD
      </button>


      <!-- VIDEO TYPE -->
      <div id="videoOptions">

        <div class="section-title">
          SELECT VIDEO TYPE
        </div>


        <button
          class="option"
          onclick="selectType('Audio Only')"
        >
          AUDIO ONLY
        </button>


        <button
          class="option"
          onclick="selectType('Video Only')"
        >
          VIDEO ONLY
        </button>


        <button
          class="option"
          onclick="selectType('Video + Audio')"
        >
          VIDEO + AUDIO
        </button>

      </div>


      <!-- QUALITY -->
      <div id="qualitySection">

        <div class="section-title">
          SELECT QUALITY
        </div>


        <button
          class="quality"
          onclick="downloadMedia('360p')"
        >
          360P
        </button>


        <button
          class="quality"
          onclick="downloadMedia('480p')"
        >
          480P
        </button>


        <button
          class="quality"
          onclick="downloadMedia('720p HD')"
        >
          720P HD
        </button>


        <button
          class="quality"
          onclick="downloadMedia('1080p Full HD')"
        >
          1080P FULL HD
        </button>

      </div>

    </div>


    <!-- MESSAGE -->
    <p
      id="message"
      class="message"
    ></p>

  </div>


  <script>

    const BACKEND_URL =
      "https://nik-downloader-backend.onrender.com";

    let selectedType = "";


    /*
      URL INPUT
      CLEAR BUTTON SHOW/HIDE
    */

    const urlInput =
      document.getElementById("url");

    const clearButton =
      document.getElementById("clearButton");


    urlInput.addEventListener("input", function () {

      const url =
        this.value.trim();


      /*
        URL hai -> CLEAR show
      */

      if (url) {

        clearButton.style.display = "block";

      } else {

        clearButton.style.display = "none";

      }


      /*
        Purana message remove
      */

      document.getElementById("message")
        .textContent = "";

    });


    /*
      URL VALIDATION
    */

    function isValidUrl(url) {

      try {

        const parsed =
          new URL(url);

        return (
          parsed.protocol === "http:" ||
          parsed.protocol === "https:"
        );

      } catch {

        return false;

      }

    }


    /*
      CHECK URL
      Sirf button click par chalega
    */

    function checkUrl() {

      const url =
        document.getElementById("url")
          .value.trim();

      const message =
        document.getElementById("message");


      if (!url || !isValidUrl(url)) {

        message.textContent =
          "✕ INVALID URL";

        return false;

      }


      message.textContent = "";

      return true;

    }


    /*
      IMAGE DOWNLOAD
    */

    function selectImage() {

      if (!checkUrl()) {
        return;
      }


      selectedType =
        "IMAGE";


      document.getElementById("videoOptions")
        .style.display = "none";


      document.getElementById("qualitySection")
        .style.display = "none";


      document.getElementById("message")
        .textContent =
        "IMAGE DOWNLOAD SELECTED.";

    }


    /*
      PROFILE DP DOWNLOAD
    */

    function selectProfileDP() {

      if (!checkUrl()) {
        return;
      }


      selectedType =
        "PROFILE DP";


      document.getElementById("videoOptions")
        .style.display = "none";


      document.getElementById("qualitySection")
        .style.display = "none";


      document.getElementById("message")
        .textContent =
        "PROFILE DP DOWNLOAD SELECTED.";

    }


    /*
      VIDEO DOWNLOAD
    */

    function showVideoOptions() {

      if (!checkUrl()) {
        return;
      }


      selectedType = "";


      document.getElementById("videoOptions")
        .style.display = "block";


      document.getElementById("qualitySection")
        .style.display = "none";


      document.getElementById("message")
        .textContent =
        "SELECT VIDEO TYPE.";

    }


    /*
      VIDEO TYPE
    */

    function selectType(type) {

      if (!checkUrl()) {
        return;
      }


      selectedType =
        type;


      document.getElementById("qualitySection")
        .style.display = "block";


      document.getElementById("message")
        .textContent =
        type.toUpperCase() +
        " SELECTED. SELECT QUALITY.";

    }


    /*
      DOWNLOAD
    */

    function downloadMedia(quality) {

      if (!checkUrl()) {
        return;
      }


      if (!selectedType) {

        document.getElementById("message")
          .textContent =
          "PLEASE SELECT DOWNLOAD TYPE.";

        return;

      }


      const url =
        document.getElementById("url")
          .value.trim();


      document.getElementById("message")
        .textContent =
        "DOWNLOAD STARTING...";


      const downloadUrl =
        BACKEND_URL +
        "/download?url=" +
        encodeURIComponent(url);


      window.location.href =
        downloadUrl;

    }


    /*
      CLEAR
    */

    function clearAll() {

      /*
        URL remove
      */

      urlInput.value = "";


      /*
        CLEAR button hide
      */

      clearButton.style.display =
        "none";


      /*
        Video options hide
      */

      document.getElementById("videoOptions")
        .style.display = "none";


      /*
        Quality options hide
      */

      document.getElementById("qualitySection")
        .style.display = "none";


      /*
        Message clear
      */

      document.getElementById("message")
        .textContent = "";


      /*
        Selected type reset
      */

      selectedType = "";

    }

  </script>

</body>
</html>
