<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NIK DOWNLOADER</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  background: #f1f5f9;
  color: #0f172a;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 20px;
}

.container {
  width: 100%;
  max-width: 520px;

  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 22px;
  padding: 25px;

  box-shadow: 0 10px 35px rgba(0,0,0,.12);
}

h1 {
  text-align: center;
  font-size: 30px;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 15px;

  border: 1px solid #cbd5e1;
  outline: none;
  border-radius: 12px;

  background: white;
  color: #111827;

  font-size: 16px;
  text-align: center;
}

input:focus {
  border-color: #2563eb;
}

input::placeholder {
  text-align: center;
}

button {
  width: 100%;
  border: none;
  border-radius: 12px;

  padding: 14px;
  margin-top: 10px;

  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.clear-btn {
  background: #ef4444;
  color: white;
}

.option {
  background: #e2e8f0;
  color: #0f172a;
}

.quality {
  background: #2563eb;
  color: white;
}

#clearButton {
  display: none;
}

#options {
  min-height: 430px;
  padding-top: 10px;
}

#downloadButtons {
  display: none;
}

#videoOptions {
  display: none;
}

#qualitySection {
  display: none;
}

.section-title {
  margin-top: 18px;
  margin-bottom: 8px;

  font-size: 15px;
  color: #64748b;

  font-weight: bold;
  text-align: center;
}

.message {
  text-align: center;
  margin-top: 15px;

  color: #64748b;
  font-size: 14px;

  min-height: 20px;
  font-weight: bold;
}

@media (prefers-color-scheme: dark) {

  body {
    background: #0f172a;
    color: #f8fafc;
  }

  .container {
    background: #1e293b;
    border-color: #334155;
  }

  .section-title {
    color: #cbd5e1;
  }

  .message {
    color: #cbd5e1;
  }

  input {
    background: #0f172a;
    color: white;
    border-color: #475569;
  }

  input::placeholder {
    color: #94a3b8;
  }

  .option {
    background: #334155;
    color: white;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>NIK DOWNLOADER</h1>

<input
  id="url"
  type="text"
  placeholder="PASTE URL HERE"
  autocomplete="off"
  spellcheck="false"
>

<button
  id="clearButton"
  class="clear-btn"
  onclick="clearAll()"
>
CLEAR
</button>

<div id="options">

  <div id="downloadButtons">

    <div class="section-title">
      SELECT DOWNLOAD TYPE
    </div>

    <button
      class="option"
      onclick="selectImage()"
    >
      DOWNLOAD IMAGE
    </button>

    <button
      class="option"
      onclick="showVideoOptions()"
    >
      DOWNLOAD VIDEO
    </button>

  </div>

  <div id="videoOptions">

    <div class="section-title">
      SELECT VIDEO TYPE
    </div>

    <button
      class="option"
      onclick="selectType('Audio Only')"
    >
      AUDIO ONLY
    </button>

    <button
      class="option"
      onclick="selectType('Video Only')"
    >
      VIDEO ONLY
    </button>

    <button
      class="option"
      onclick="selectType('Video + Audio')"
    >
      VIDEO + AUDIO
    </button>

  </div>

  <div id="qualitySection">

    <div class="section-title">
      SELECT QUALITY
    </div>

    <button
      class="quality"
      onclick="downloadQuality('360p')"
    >
      360P
    </button>

    <button
      class="quality"
      onclick="downloadQuality('480p')"
    >
      480P
    </button>

    <button
      class="quality"
      onclick="downloadQuality('720p')"
    >
      720P
    </button>

    <button
      class="quality"
      onclick="downloadQuality('1080p')"
    >
      1080P
    </button>

  </div>

</div>

<p id="message" class="message"></p>

</div>

<script>

const BACKEND_URL =
"https://nik-downloader-backend.onrender.com";

const urlInput =
document.getElementById("url");

const clearButton =
document.getElementById("clearButton");

const downloadButtons =
document.getElementById("downloadButtons");

const videoOptions =
document.getElementById("videoOptions");

const qualitySection =
document.getElementById("qualitySection");

const message =
document.getElementById("message");

let selectedType = "";


/* =========================
   URL INPUT
========================= */

urlInput.addEventListener(
  "input",
  function () {

    const url =
      this.value.trim();

    if (url) {

      clearButton.style.display =
        "block";

      downloadButtons.style.display =
        "block";

    } else {

      resetPage();

    }

  }
);


/* =========================
   URL VALIDATION
========================= */

function isValidUrl(url) {

  try {

    const parsed =
      new URL(url);

    return (
      parsed.protocol === "http:" ||
      parsed.protocol === "https:"
    );

  } catch {

    return false;

  }

}


function checkUrl() {

  const url =
    urlInput.value.trim();

  if (!url || !isValidUrl(url)) {

    message.textContent =
      "✕ INVALID URL";

    return false;

  }

  message.textContent =
    "";

  return true;

}


/* =========================
   DOWNLOAD IMAGE
========================= */

async function selectImage() {

  if (!checkUrl()) return;

  const url =
    urlInput.value.trim();

  videoOptions.style.display =
    "none";

  qualitySection.style.display =
    "none";

  message.textContent =
    "FINDING PUBLIC IMAGE...";

  try {

    const response =
      await fetch(
        BACKEND_URL +
        "/download-image?url=" +
        encodeURIComponent(url)
      );

    if (!response.ok) {

      let errorMessage =
        "IMAGE DOWNLOAD FAILED.";

      try {

        const data =
          await response.json();

        if (data.message) {

          errorMessage =
            data.message;

        }

      } catch {}

      message.textContent =
        "✕ " + errorMessage;

      return;

    }

    const blob =
      await response.blob();

    const objectUrl =
      URL.createObjectURL(blob);

    const downloadLink =
      document.createElement("a");

    downloadLink.href =
      objectUrl;

    downloadLink.download =
      "NIK-DOWNLOADER-IMAGE";

    document.body.appendChild(
      downloadLink
    );

    downloadLink.click();

    downloadLink.remove();

    setTimeout(
      () => {
        URL.revokeObjectURL(
          objectUrl
        );
      },
      1000
    );

    message.textContent =
      "✓ IMAGE DOWNLOADED.";

  } catch (error) {

    console.error(
      "Image download error:",
      error
    );

    message.textContent =
      "✕ IMAGE DOWNLOAD FAILED.";

  }

}


/* =========================
   VIDEO OPTIONS
========================= */

function showVideoOptions() {

  if (!checkUrl()) return;

  selectedType =
    "";

  videoOptions.style.display =
    "block";

  qualitySection.style.display =
    "none";

  message.textContent =
    "SELECT VIDEO TYPE.";

}


/* =========================
   VIDEO TYPE
========================= */

function selectType(type) {

  if (!checkUrl()) return;

  selectedType =
    type;

  qualitySection.style.display =
    "block";

  message.textContent =
    type.toUpperCase() +
    " SELECTED. SELECT QUALITY.";

}


/* =========================
   VIDEO DOWNLOAD
========================= */

function downloadQuality(quality) {

  if (!checkUrl()) return;

  const url =
    urlInput.value.trim();

  message.textContent =
    "STARTING DOWNLOAD...";

  const downloadUrl =
    BACKEND_URL +
    "/download?url=" +
    encodeURIComponent(url) +
    "&type=" +
    encodeURIComponent(selectedType) +
    "&quality=" +
    encodeURIComponent(quality);

  window.location.href =
    downloadUrl;

}


/* =========================
   CLEAR
========================= */

function clearAll() {

  resetPage();

}


/* =========================
   RESET
========================= */

function resetPage() {

  urlInput.value =
    "";

  clearButton.style.display =
    "none";

  downloadButtons.style.display =
    "none";

  videoOptions.style.display =
    "none";

  qualitySection.style.display =
    "none";

  message.textContent =
    "";

  selectedType =
    "";

}

</script>

</body>
</html>
