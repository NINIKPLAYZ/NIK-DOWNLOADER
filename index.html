<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NIK DOWNLOADER</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f1f5f9;
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #cbd5e1;
      outline: none;
      border-radius: 12px;
      background: white;
      color: #111827;
      font-size: 16px;
      margin-bottom: 12px;
      text-align: center;
    }

    input::placeholder {
      text-align: center;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .download-main {
      background: #22c55e;
      color: white;
    }

    .download-main:hover {
      background: #16a34a;
    }

    .option {
      background: #e2e8f0;
      color: #0f172a;
    }

    .quality {
      background: #2563eb;
      color: white;
    }

    #options {
      display: none;
      margin-top: 20px;
    }

    #videoOptions {
      display: none;
    }

    #qualitySection {
      display: none;
    }

    .section-title {
      margin-top: 18px;
      margin-bottom: 8px;
      font-size: 15px;
      color: #64748b;
      font-weight: bold;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      color: #64748b;
      font-size: 14px;
      min-height: 20px;
    }

    /* AUTOMATIC DARK MODE */

    @media (prefers-color-scheme: dark) {

      body {
        background: #0f172a;
        color: #f8fafc;
      }

      .container {
        background: #1e293b;
        border-color: #334155;
        box-shadow: 0 10px 35px rgba(0,0,0,0.45);
      }

      .subtitle,
      .section-title,
      .message {
        color: #cbd5e1;
      }

      input {
        background: #f8fafc;
        color: #111827;
        border-color: #475569;
      }

      .option {
        background: #334155;
        color: white;
      }

      .option:hover {
        background: #475569;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>NIK DOWNLOADER</h1>

    <p class="subtitle">
      Download available media from supported sources
    </p>

    <input
      id="url"
      type="url"
      placeholder="PASTE URL HERE"
    >

    <button
      class="download-main"
      onclick="showOptions()"
    >
      DOWNLOAD
    </button>


    <div id="options">

      <div class="section-title">
        SELECT DOWNLOAD TYPE
      </div>


      <button
        class="option"
        onclick="selectImage()"
      >
        IMAGE DOWNLOAD
      </button>


      <button
        class="option"
        onclick="selectProfileDP()"
      >
        PROFILE DP DOWNLOAD
      </button>


      <button
        class="option"
        onclick="showVideoOptions()"
      >
        VIDEO DOWNLOAD
      </button>


      <div id="videoOptions">

        <div class="section-title">
          SELECT VIDEO TYPE
        </div>

        <button
          class="option"
          onclick="selectType('Audio Only')"
        >
          AUDIO ONLY
        </button>

        <button
          class="option"
          onclick="selectType('Video Only')"
        >
          VIDEO ONLY
        </button>

        <button
          class="option"
          onclick="selectType('Video + Audio')"
        >
          VIDEO + AUDIO
        </button>

      </div>


      <div id="qualitySection">

        <div class="section-title">
          SELECT QUALITY
        </div>

        <button
          class="quality"
          onclick="downloadMedia('360p')"
        >
          360P
        </button>

        <button
          class="quality"
          onclick="downloadMedia('480p')"
        >
          480P
        </button>

        <button
          class="quality"
          onclick="downloadMedia('720p HD')"
        >
          720P HD
        </button>

        <button
          class="quality"
          onclick="downloadMedia('1080p Full HD')"
        >
          1080P FULL HD
        </button>

      </div>

    </div>


    <p
      id="message"
      class="message"
    ></p>

  </div>


  <script>

    let selectedType = "";


    function showOptions() {

      const url =
        document.getElementById("url").value.trim();

      const message =
        document.getElementById("message");

      if (!url) {

        message.textContent =
          "PLEASE PASTE A URL FIRST.";

        return;
      }

      document.getElementById("options")
        .style.display = "block";

      message.textContent =
        "SELECT WHAT YOU WANT TO DOWNLOAD.";
    }


    function selectImage() {

      selectedType = "IMAGE";

      document.getElementById("videoOptions")
        .style.display = "none";

      document.getElementById("qualitySection")
        .style.display = "none";

      document.getElementById("message")
        .textContent =
        "IMAGE DOWNLOAD SELECTED.";
    }


    function selectProfileDP() {

      selectedType = "PROFILE DP";

      document.getElementById("videoOptions")
        .style.display = "none";

      document.getElementById("qualitySection")
        .style.display = "none";

      document.getElementById("message")
        .textContent =
        "PROFILE DP DOWNLOAD SELECTED.";
    }


    function showVideoOptions() {

      document.getElementById("videoOptions")
        .style.display = "block";

      document.getElementById("qualitySection")
        .style.display = "none";

      document.getElementById("message")
        .textContent =
        "SELECT VIDEO TYPE.";
    }


    function selectType(type) {

      selectedType = type;

      document.getElementById("qualitySection")
        .style.display = "block";

      document.getElementById("message")
        .textContent =
        type.toUpperCase() +
        " SELECTED. SELECT QUALITY.";
    }


    function downloadMedia(quality) {

      const url =
        document.getElementById("url").value.trim();

      if (!url) {

        document.getElementById("message")
          .textContent =
          "PLEASE PASTE A URL FIRST.";

        return;
      }

      if (!selectedType) {
        return;
      }

      document.getElementById("message")
        .textContent =
        "PREPARING " +
        selectedType +
        " - " +
        quality +
        "...";


      /*
        ACTUAL DOWNLOAD BACKEND/API
        WILL BE CONNECTED HERE.

        Only content that the user is
        authorized/permitted to download
        should be processed.
      */

      alert(
        "DOWNLOAD SELECTED\n\n" +
        "TYPE: " + selectedType +
        "\nQUALITY: " + quality +
        "\n\nBACKEND DOWNLOAD SYSTEM NEEDS TO BE CONNECTED."
      );
    }

  </script>

</body>
</html>
